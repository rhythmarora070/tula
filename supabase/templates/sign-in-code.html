<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#F6F3FA;font-family:'Nunito Sans',Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#2A2535">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F3FA;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border:1px solid #E3DCEE;border-radius:18px;padding:28px">
            <tr>
              <td>
                <p style="margin:0 0 4px;font-size:22px;font-weight:700">Tula</p>
                <p style="margin:0 0 22px;font-size:14px;color:#6F6880">Every deadline, sorted by what's at stake.</p>
                <p style="margin:0 0 10px;font-size:16px">Your sign-in code is:</p>
                <p style="margin:0 0 18px;font-size:34px;font-weight:700;letter-spacing:8px;color:#7462B5;font-family:Menlo,Consolas,monospace">{{ .Token }}</p>
                <p style="margin:0 0 6px;font-size:15px">Type it into Tula to sign in. It works once and expires in 10 minutes.</p>
                <p style="margin:18px 0 0;font-size:13px;color:#6F6880">Didn't ask to sign in? Ignore this email; nothing happens without the code.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
